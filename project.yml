name: ManiFlix
options:
  bundleIdPrefix: bond.maniakov
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "10"
    GENERATE_INFOPLIST_FILE: "NO"
    APP_BUNDLE_ID: "bond.maniakov.maniflix"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  ManiFlix:
    type: application
    platform: iOS
    sources:
      - path: ManiFlix
        excludes:
          - "**/*.md"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PRODUCT_NAME: ManiFlix
        MARKETING_VERSION: "1.0.8"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ManiFlix/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: ManiFlixWidgets
        embed: true

  ManiFlixWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ManiFlixWidgets
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).widgets"
        PRODUCT_NAME: ManiFlixWidgets
        MARKETING_VERSION: "1.0.8"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ManiFlixWidgets/Info.plist
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
