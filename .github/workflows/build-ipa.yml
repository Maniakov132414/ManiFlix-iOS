name: Build ManiFlix iOS IPAs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa-matrix:
    name: Build 4 ManiFlix IPA Variants
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 & Check Tools
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Normalize AppIcon to 1024x1024 opaque PNG
        run: |
          ICON_SRC="ManiFlix/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          sips -s format bmp "$ICON_SRC" --out /tmp/appicon.bmp
          sips -s format png -z 1024 1024 /tmp/appicon.bmp --out "$ICON_SRC"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON_SRC"

      - name: Generate Xcode Project & Assert Info.plist Integrity
        run: |
          xcodegen generate
          python3 -c "
          import plistlib
          app_pl = plistlib.loads(open('ManiFlix/Info.plist', 'rb').read())
          wid_pl = plistlib.loads(open('ManiFlixWidgets/Info.plist', 'rb').read())
          assert app_pl.get('CFBundleShortVersionString') == '1.2.0', app_pl
          assert app_pl.get('LSRequiresIPhoneOS') is True, app_pl
          assert app_pl.get('UIRequiresFullScreen') is False, app_pl
          assert wid_pl.get('NSExtension', {}).get('NSExtensionPointIdentifier') == 'com.apple.widgetkit-extension', wid_pl
          print('Info.plist integrity verified before archive!')
          "

      - name: Prepare Output Directory
        run: mkdir -p dist

      - name: Build Modern Pair (iOS 17–26+ Adaptive Liquid Glass)
        run: |
          # NoPlugins (bond.maniakov.maniflix)
          xcodebuild archive \
            -project ManiFlix.xcodeproj \
            -scheme ManiFlix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-modern \
            -archivePath /tmp/ManiFlix-Modern-NoPlug.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            APP_BUNDLE_ID=bond.maniakov.maniflix \
            MARKETING_VERSION=1.2.0 \
            CURRENT_PROJECT_VERSION=14 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          rm -rf /tmp/pkg-mod-noplug && mkdir -p /tmp/pkg-mod-noplug/Payload
          cp -R /tmp/ManiFlix-Modern-NoPlug.xcarchive/Products/Applications/ManiFlix.app /tmp/pkg-mod-noplug/Payload/ManiFlix.app
          rm -rf /tmp/pkg-mod-noplug/Payload/ManiFlix.app/PlugIns
          rm -rf /tmp/pkg-mod-noplug/Payload/ManiFlix.app/_CodeSignature
          chmod +x /tmp/pkg-mod-noplug/Payload/ManiFlix.app/ManiFlix
          (cd /tmp/pkg-mod-noplug && zip -qry "$GITHUB_WORKSPACE/dist/ManiFlix-iOS17-NoPlug.ipa" Payload)
          cp "$GITHUB_WORKSPACE/dist/ManiFlix-iOS17-NoPlug.ipa" "$GITHUB_WORKSPACE/dist/ManiFlix.ipa"

          # Full + Widget (bond.maniakov.maniflix.full)
          xcodebuild archive \
            -project ManiFlix.xcodeproj \
            -scheme ManiFlix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-modern \
            -archivePath /tmp/ManiFlix-Modern-Full.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            APP_BUNDLE_ID=bond.maniakov.maniflix.full \
            MARKETING_VERSION=1.2.0 \
            CURRENT_PROJECT_VERSION=14 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          rm -rf /tmp/pkg-mod-full && mkdir -p /tmp/pkg-mod-full/Payload
          cp -R /tmp/ManiFlix-Modern-Full.xcarchive/Products/Applications/ManiFlix.app /tmp/pkg-mod-full/Payload/ManiFlix.app
          rm -rf /tmp/pkg-mod-full/Payload/ManiFlix.app/_CodeSignature
          rm -rf /tmp/pkg-mod-full/Payload/ManiFlix.app/PlugIns/*/_CodeSignature
          chmod +x /tmp/pkg-mod-full/Payload/ManiFlix.app/ManiFlix
          chmod +x /tmp/pkg-mod-full/Payload/ManiFlix.app/PlugIns/ManiFlixWidgets.appex/ManiFlixWidgets
          (cd /tmp/pkg-mod-full && zip -qry "$GITHUB_WORKSPACE/dist/ManiFlix-iOS17-Full.ipa" Payload)

      - name: Build Legacy Pair (iOS 15–18+ OLED Default)
        run: |
          # NoPlugins (bond.maniakov.maniflix.legacy)
          xcodebuild archive \
            -project ManiFlix.xcodeproj \
            -scheme ManiFlix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-legacy \
            -archivePath /tmp/ManiFlix-Legacy-NoPlug.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="RELEASE LEGACY_UI_DEFAULT" \
            APP_BUNDLE_ID=bond.maniakov.maniflix.legacy \
            MARKETING_VERSION=1.2.0 \
            CURRENT_PROJECT_VERSION=14 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          rm -rf /tmp/pkg-leg-noplug && mkdir -p /tmp/pkg-leg-noplug/Payload
          cp -R /tmp/ManiFlix-Legacy-NoPlug.xcarchive/Products/Applications/ManiFlix.app /tmp/pkg-leg-noplug/Payload/ManiFlix.app
          rm -rf /tmp/pkg-leg-noplug/Payload/ManiFlix.app/PlugIns
          rm -rf /tmp/pkg-leg-noplug/Payload/ManiFlix.app/_CodeSignature
          chmod +x /tmp/pkg-leg-noplug/Payload/ManiFlix.app/ManiFlix
          (cd /tmp/pkg-leg-noplug && zip -qry "$GITHUB_WORKSPACE/dist/ManiFlix-Legacy-iOS15-NoPlug.ipa" Payload)

          # Full + Widget (bond.maniakov.maniflix.legacy.full)
          xcodebuild archive \
            -project ManiFlix.xcodeproj \
            -scheme ManiFlix \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-legacy \
            -archivePath /tmp/ManiFlix-Legacy-Full.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="RELEASE LEGACY_UI_DEFAULT" \
            APP_BUNDLE_ID=bond.maniakov.maniflix.legacy.full \
            MARKETING_VERSION=1.2.0 \
            CURRENT_PROJECT_VERSION=14 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          rm -rf /tmp/pkg-leg-full && mkdir -p /tmp/pkg-leg-full/Payload
          cp -R /tmp/ManiFlix-Legacy-Full.xcarchive/Products/Applications/ManiFlix.app /tmp/pkg-leg-full/Payload/ManiFlix.app
          rm -rf /tmp/pkg-leg-full/Payload/ManiFlix.app/_CodeSignature
          rm -rf /tmp/pkg-leg-full/Payload/ManiFlix.app/PlugIns/*/_CodeSignature
          chmod +x /tmp/pkg-leg-full/Payload/ManiFlix.app/ManiFlix
          chmod +x /tmp/pkg-leg-full/Payload/ManiFlix.app/PlugIns/ManiFlixWidgets.appex/ManiFlixWidgets
          (cd /tmp/pkg-leg-full && zip -qry "$GITHUB_WORKSPACE/dist/ManiFlix-Legacy-iOS15-Full.ipa" Payload)

      - name: Strict Python Validation of All 5 IPA Archives
        run: |
          python3 - <<'PY'
          import zipfile, plistlib, glob, os

          files = sorted(glob.glob("dist/*.ipa"))
          assert len(files) == 5, f"Expected 5 IPAs, found {files}"
          for path in files:
              name = os.path.basename(path)
              with zipfile.ZipFile(path) as zf:
                  names = zf.namelist()
                  assert not any("_CodeSignature" in n for n in names), f"{name}: found stale _CodeSignature"
                  pl = plistlib.loads(zf.read("Payload/ManiFlix.app/Info.plist"))
                  assert pl.get("CFBundleShortVersionString") == "1.2.0", f"{name}: wrong version {pl.get('CFBundleShortVersionString')}"
                  assert pl.get("CFBundleVersion") == "14", f"{name}: wrong build {pl.get('CFBundleVersion')}"
                  assert pl.get("LSRequiresIPhoneOS") is True, f"{name}: missing LSRequiresIPhoneOS"
                  assert pl.get("UIRequiresFullScreen") is False, f"{name}: missing UIRequiresFullScreen=False"
                  assert "UILaunchScreen" in pl, f"{name}: missing UILaunchScreen"
                  exe_info = zf.getinfo("Payload/ManiFlix.app/ManiFlix")
                  assert ((exe_info.external_attr >> 16) & 0o111) != 0, f"{name}: binary not executable"

                  if "Full" not in name:
                      assert not any("/PlugIns/" in n for n in names), f"{name}: unexpected PlugIns"
                  else:
                      wpl = plistlib.loads(zf.read("Payload/ManiFlix.app/PlugIns/ManiFlixWidgets.appex/Info.plist"))
                      assert wpl.get("CFBundleShortVersionString") == "1.2.0", f"{name}: wrong widget version"
                      assert wpl.get("NSExtension", {}).get("NSExtensionPointIdentifier") == "com.apple.widgetkit-extension", f"{name}: widget missing NSExtension"

                  print(f"OK {name}: bid={pl.get('CFBundleIdentifier')} ver={pl.get('CFBundleShortVersionString')} ({pl.get('CFBundleVersion')}) minOS={pl.get('MinimumOSVersion')} size={os.path.getsize(path)}")
          PY

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManiFlix-iOS-IPAs
          path: dist/*.ipa
          retention-days: 30

      - name: Publish GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: ManiFlix 1.2.0
          body: |
            ## ManiFlix 1.2.0
            - Chọn ngôn ngữ lần đầu mở app (Tiếng Việt / English) và tự động cấu hình phụ đề mặc định tương ứng.
            - Thêm cài đặt Ngôn ngữ ứng dụng & Phụ đề mặc định (Tiếng Việt / English / Tắt), tự chọn phụ đề `.vtt` từ VSMov khi phát phim và tối ưu failover stream.
            - **Link Repo**: `https://phim.maniakov.bond/repo.json`
          files: dist/*.ipa
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
